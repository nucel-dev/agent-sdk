name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

  check-core:
    name: Core dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # `nucel-agent-core` is the crate every provider — and every future
      # third-party provider — depends on. Its value is that it stays small and
      # provider-agnostic: traits, types, errors, retry policy, nothing else.
      # A single provider or transport dependency here would force that weight
      # onto every consumer and quietly make `core` the place new provider code
      # lands. This gate makes that a build failure rather than a code-review
      # judgement call.
      #
      # Keep the ban list current when a provider or transport is added to the
      # workspace — a stale list is a gate that silently stops gating.
      - name: Verify crates/core has no provider dependencies
        run: |
          set -euo pipefail

          BANNED=(
            # Sibling provider crates — core must never depend "upward".
            nucel-agent-claude-code
            nucel-agent-codex
            nucel-agent-opencode
            nucel-agent-bedrock
            nucel-agent-vertex
            nucel-agent-sdk
            # Transports and cloud SDKs — these belong in provider crates.
            reqwest
            aws-config
            aws-sdk-bedrockruntime
            gcp_auth
            octocrab
            # Server / infrastructure crates that have no business in a
            # provider-agnostic trait crate.
            axum
            kube
            k8s-openapi
            lettre
            sentry
          )

          CORE_DEPS="$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.name == "nucel-agent-core") | .dependencies[].name')"

          echo "crates/core declares:"
          echo "$CORE_DEPS" | sed 's/^/  - /'

          failed=0
          for dep in "${BANNED[@]}"; do
            if echo "$CORE_DEPS" | grep -qx "$dep"; then
              echo "::error::banned dependency '$dep' found in crates/core/Cargo.toml"
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo "crates/core must stay provider-agnostic — move this dependency"
            echo "into the provider crate that actually needs it."
            exit 1
          fi

          echo "✅ crates/core is clean — no banned dependencies"

  publish-check:
    name: Publish check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Verify the workspace is releasable to crates.io.
      #
      # We can't run `cargo publish --dry-run` on the downstream crates here:
      # they depend on siblings via `{ path = "..", version = "x.y.z" }`, and a
      # dry-run resolves that version requirement against crates.io. When a
      # release bumps a sibling (e.g. nucel-agent-core 0.2.0 -> 0.2.1), the new
      # version isn't on crates.io yet, so the dry-run can't select it and the
      # downstream crates fail — even though the workspace is perfectly
      # releasable. The real release publishes in dependency order, so each
      # sibling is on the registry by the time the next crate needs it.
      #
      # Instead:
      #   * nucel-agent-core has no path-deps, so a full registry-verified
      #     dry-run is meaningful — it compiles the packaged crate end to end.
      #   * `cargo package --workspace --no-verify` packages every crate and
      #     resolves the inter-crate path/version requirements from the local
      #     workspace, catching manifest, metadata, and file-inclusion problems
      #     across all 7 crates (the old check only covered 5). Compilation of
      #     the full workspace is already verified by the Test jobs above, so we
      #     skip the per-crate verify build that the temporary package registry
      #     can't wire up for multi-sibling dependents.
      - name: Check publish (workspace is releasable)
        run: |
          cargo publish -p nucel-agent-core --dry-run
          cargo package --workspace --no-verify
