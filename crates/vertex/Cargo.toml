[package]
name = "nucel-agent-vertex"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "GCP Vertex AI provider for Nucel agent-sdk — Claude on Vertex via the Anthropic-on-Vertex API"
repository = "https://github.com/nucel-dev/agent-sdk"
homepage = "https://github.com/nucel-dev/agent-sdk"
documentation = "https://docs.rs/nucel-agent-vertex"
readme = "README.md"
keywords = ["vertex", "gcp", "claude", "anthropic", "agent"]
categories = ["development-tools", "api-bindings"]

[dependencies]
nucel-agent-core = { path = "../core", version = "0.2.0" }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["full"] }
futures.workspace = true
reqwest.workspace = true
uuid.workspace = true
gcp_auth = "0.12"

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
wiremock.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
