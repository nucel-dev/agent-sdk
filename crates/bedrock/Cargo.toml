[package]
name = "nucel-agent-bedrock"
version = "0.1.2"
edition.workspace = true
license.workspace = true
description = "AWS Bedrock provider for Nucel agent-sdk — Claude models via Bedrock Runtime Converse API"
repository = "https://github.com/nucel-dev/agent-sdk"
homepage = "https://github.com/nucel-dev/agent-sdk"
documentation = "https://docs.rs/nucel-agent-bedrock"
readme = "README.md"
keywords = ["bedrock", "aws", "claude", "anthropic", "agent"]
categories = ["development-tools", "api-bindings"]

[dependencies]
nucel-agent-core = { path = "../core", version = "0.2.1" }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["full"] }
futures.workspace = true
uuid.workspace = true

# AWS SDK — kept loose on minor so the rust-aws ecosystem can co-evolve.
aws-config.workspace = true
aws-sdk-bedrockruntime.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
aws-smithy-mocks.workspace = true
aws-sdk-bedrockruntime = { workspace = true, features = ["test-util"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
