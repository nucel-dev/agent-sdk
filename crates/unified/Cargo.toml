[package]
name = "nucel-agent-sdk"
version = "0.2.1"
edition.workspace = true
license.workspace = true
description = "Unified AI coding agent SDK — provider-agnostic abstraction for Claude Code, Codex, and OpenCode"
repository = "https://github.com/nucel-dev/agent-sdk"
homepage = "https://github.com/nucel-dev/agent-sdk"
documentation = "https://docs.rs/nucel-agent-sdk"
readme = "../../README.md"
keywords = ["agent", "coding", "claude", "ai", "sdk"]
categories = ["development-tools", "api-bindings"]

[features]
default = []
# Pull in the AWS Bedrock provider re-export and `build_executor("bedrock")` arm.
bedrock = ["dep:nucel-agent-bedrock"]
# Pull in the GCP Vertex AI provider re-export and `build_executor("vertex")` arm.
vertex = ["dep:nucel-agent-vertex"]
# Convenience: everything.
all-providers = ["bedrock", "vertex"]

[dependencies]
nucel-agent-core = { path = "../core", version = "0.2.1" }
nucel-agent-claude-code = { path = "../claude-code", version = "0.2.1" }
nucel-agent-codex = { path = "../codex", version = "0.2.1" }
nucel-agent-opencode = { path = "../opencode", version = "0.2.0" }
nucel-agent-bedrock = { path = "../bedrock", version = "0.1.1", optional = true }
nucel-agent-vertex = { path = "../vertex", version = "0.1.1", optional = true }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["full"] }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
futures.workspace = true
wiremock.workspace = true
tempfile.workspace = true
serde_json.workspace = true
chrono.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[example]]
name = "claude_basic"
path = "examples/claude_basic.rs"

[[example]]
name = "codex_resume"
path = "examples/codex_resume.rs"

[[example]]
name = "opencode_http"
path = "examples/opencode_http.rs"

[[example]]
name = "build_executor"
path = "examples/build_executor.rs"

[[example]]
name = "streaming_claude"
path = "examples/streaming_claude.rs"

[[example]]
name = "multi_provider_handoff"
path = "examples/multi_provider_handoff.rs"

[[example]]
name = "with_hooks"
path = "examples/with_hooks.rs"

[[example]]
name = "budget_control"
path = "examples/budget_control.rs"

[[example]]
name = "resume_session"
path = "examples/resume_session.rs"

[[example]]
name = "retry_policy"
path = "examples/retry_policy.rs"

[[example]]
name = "vertex_with_retry"
path = "examples/vertex_with_retry.rs"
required-features = ["vertex"]
