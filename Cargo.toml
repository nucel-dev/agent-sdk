[workspace]
members = [
    "crates/core",
    "crates/claude-code",
    "crates/codex",
    "crates/opencode",
    "crates/bedrock",
    "crates/vertex",
    "crates/unified",
]
resolver = "2"

[workspace.package]
license = "Apache-2.0"
edition = "2021"

[workspace.dependencies]
# Core
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# HTTP
reqwest = { version = "0.12", features = ["json", "stream"] }

# Testing
wiremock = "0.6"
tempfile = "3"
tokio-test = "0.4"

# ─── Build profiles ─────────────────────────────────────────────────────────
# Cuts target/ size substantially: split-debuginfo packs DWARF into one
# .dwp file (macOS default `unpacked` is ~3x larger); strip + thin LTO
# keep release binaries small. Profile settings only affect builds OF this
# workspace, not downstream consumers of the published crates.

[profile.dev]
split-debuginfo = "packed"
debug = "line-tables-only"
incremental = false

[profile.release]
strip = true
lto = "thin"
codegen-units = 16
debug = "line-tables-only"

[profile.test]
split-debuginfo = "packed"
debug = "line-tables-only"
incremental = false
